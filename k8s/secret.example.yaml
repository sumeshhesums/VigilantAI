apiVersion: v1
kind: Secret
metadata:
  name: vigilantai-secrets
  namespace: vigilantai
  labels:
    app.kubernetes.io/part-of: vigilantai
type: Opaque
stringData:
  # -- PostgreSQL --
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"

  # -- Backend JWT (generate with: openssl genrsa 4096 | openssl pkcs8 -topk8 -nocrypt -outform PEM) --
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_ACTUAL_PRIVATE_KEY
    -----END PRIVATE KEY-----
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_ACTUAL_PUBLIC_KEY
    -----END PUBLIC KEY-----

  # -- Backend auth token for camera-gateway --
  GATEWAY_AUTH_TOKEN: ""

  # -- Notification webhook URL --
  NOTIFICATION_WEBHOOK_URL: ""
