apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: vigilantai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: vigilantai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: vigilantai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: vigilantai/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: BACKEND_HOST
            - name: BACKEND_PORT
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: BACKEND_PORT
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/vigilantai"
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vigilantai-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: RUST_LOG
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: vigilantai-secrets
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: vigilantai-secrets
                  key: JWT_PUBLIC_KEY
            - name: JWT_ACCESS_TOKEN_EXPIRY_SECS
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: JWT_ACCESS_TOKEN_EXPIRY_SECS
            - name: JWT_REFRESH_TOKEN_EXPIRY_SECS
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: JWT_REFRESH_TOKEN_EXPIRY_SECS
            - name: EVIDENCE_STORAGE_PATH
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: EVIDENCE_STORAGE_PATH
            - name: EVIDENCE_MAX_FILE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: EVIDENCE_MAX_FILE_SIZE
            - name: NOTIFICATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: NOTIFICATION_ENABLED
            - name: NOTIFICATION_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: vigilantai-secrets
                  key: NOTIFICATION_WEBHOOK_URL
            - name: NOTIFICATION_WEBHOOK_TIMEOUT_SECS
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: NOTIFICATION_WEBHOOK_TIMEOUT_SECS
            - name: NOTIFICATION_EMAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: NOTIFICATION_EMAIL_ENABLED
            - name: NOTIFICATION_MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: vigilantai-config
                  key: NOTIFICATION_MAX_RETRIES
          volumeMounts:
            - name: evidence-data
              mountPath: /data/evidence
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: evidence-data
          persistentVolumeClaim:
            claimName: vigilantai-evidence-pvc
