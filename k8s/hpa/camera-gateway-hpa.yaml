apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: camera-gateway-hpa
  namespace: vigilantai
  labels:
    app.kubernetes.io/name: camera-gateway
    app.kubernetes.io/part-of: vigilantai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: camera-gateway
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
