apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vigilantai-postgres-pvc
  namespace: vigilantai
  labels:
    app.kubernetes.io/part-of: vigilantai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
