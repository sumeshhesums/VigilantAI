apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: vigilantai
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: vigilantai
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert.rules.yml
      - /etc/prometheus/recording.rules.yml

    scrape_configs:
      - job_name: "vigilantai-backend"
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8080"]
            labels:
              service: backend
              environment: production

      - job_name: "vigilantai-ai-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["ai-service:8081"]
            labels:
              service: ai-service
              environment: production

      - job_name: "vigilantai-camera-gateway"
        metrics_path: /metrics
        static_configs:
          - targets: ["camera-gateway:8082"]
            labels:
              service: camera-gateway
              environment: production

      - job_name: "vigilantai-dashboard"
        metrics_path: /api/metrics
        static_configs:
          - targets: ["dashboard:3000"]
            labels:
              service: dashboard
              environment: production

      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

  alert.rules.yml: |
    groups:
      - name: vigilantai_alerts
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "{{ $labels.instance }} has been down for more than 1 minute."

  recording.rules.yml: |
    groups:
      - name: vigilantai_recording
        rules:
          - record: vigilantai:http_requests:rate5m
            expr: sum(rate(http_requests_total[5m])) by (service)
