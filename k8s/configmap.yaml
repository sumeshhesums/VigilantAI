apiVersion: v1
kind: ConfigMap
metadata:
  name: vigilantai-config
  namespace: vigilantai
  labels:
    app.kubernetes.io/part-of: vigilantai
data:
  # -- Backend --
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8080"
  RUST_LOG: "backend=info,tower_http=info"
  JWT_ACCESS_TOKEN_EXPIRY_SECS: "900"
  JWT_REFRESH_TOKEN_EXPIRY_SECS: "604800"
  EVIDENCE_STORAGE_PATH: "/data/evidence"
  EVIDENCE_MAX_FILE_SIZE: "20971520"
  NOTIFICATION_ENABLED: "true"
  NOTIFICATION_WEBHOOK_TIMEOUT_SECS: "10"
  NOTIFICATION_EMAIL_ENABLED: "false"
  NOTIFICATION_MAX_RETRIES: "3"

  # -- AI Service --
  AI_SERVICE_HOST: "0.0.0.0"
  AI_SERVICE_PORT: "8081"
  AI_SERVICE_LOG_LEVEL: "INFO"
  AI_SERVICE_DEFAULT_MODEL: "yolov8n"
  AI_SERVICE_DEVICE: "cpu"
  AI_SERVICE_AUTO_LOAD: "true"
  AI_SERVICE_CONFIDENCE_THRESHOLD: "0.5"
  AI_SERVICE_IOU_THRESHOLD: "0.45"

  # -- Camera Gateway --
  GATEWAY_PORT: "8082"

  # -- Dashboard --
  NEXT_PUBLIC_API_URL: "http://backend.vigilantai.svc.cluster.local:8080/api/v1"

  # -- Service URLs (Kubernetes DNS) --
  POSTGRES_HOST: "postgres.vigilantai.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "vigilantai"
  POSTGRES_USER: "vigilant"
  REDIS_HOST: "redis.vigilantai.svc.cluster.local"
  REDIS_PORT: "6379"
  BACKEND_SERVICE_URL: "http://backend.vigilantai.svc.cluster.local:8080"
  AI_SERVICE_URL: "http://ai-service.vigilantai.svc.cluster.local:8081"
