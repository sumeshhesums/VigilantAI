server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: ""
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["vigilantai.collect=true"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_container_number']
        target_label: 'container_number'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_vigilantai_environment']
        target_label: 'environment'
        fallback_labels:
          environment: 'development'
    pipeline_stages:
      - docker: {}
      - labels:
          level: ''
          message: ''
      - json:
          expressions:
            level: level
            msg: msg
            message: message
            err: err
            error: error
            trace_id: trace_id
            span_id: span_id
            timestamp: timestamp
      - labels:
          level:
      - output:
          source: message

  - job_name: kubernetes
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - vigilantai
    relabel_configs:
      - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_name']
        target_label: 'service'
      - source_labels: ['__meta_kubernetes_namespace']
        target_label: 'namespace'
      - source_labels: ['__meta_kubernetes_pod_name']
        target_label: 'pod'
      - source_labels: ['__meta_kubernetes_pod_container_name']
        target_label: 'container'
      - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_component']
        target_label: 'component'
      - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_part_of']
        target_label: 'part_of'
      - source_labels: ['__meta_kubernetes_pod_annotation_prometheus_io_scrape']
        action: keep
        regex: true
      - source_labels: ['__meta_kubernetes_pod_annotation_vigilantai_log_level']
        target_label: 'level'
        fallback_labels:
          level: 'info'
    pipeline_stages:
      - cri: {}
      - json:
          expressions:
            level: level
            msg: msg
            message: message
            err: err
            error: error
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
      - output:
          source: message

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          service: system
          environment: development
          __path__: /var/log/syslog
      - targets:
          - localhost
        labels:
          job: system
          service: system
          environment: development
          __path__: /var/log/messages

  - job_name: system-journal
    journal:
      max_age: 12h
      labels:
        job: systemd
        service: systemd-journal
        environment: development
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal__hostname']
        target_label: 'hostname'
      - source_labels: ['__journal_priority_keyword']
        target_label: 'level'
