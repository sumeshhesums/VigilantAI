name: vigilantai
description: "VigilantAI mobile app - Enterprise AI surveillance platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Code generation
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.4

  # Functional programming
  dartz: ^0.10.1

  # UI
  fl_chart: ^0.69.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Connectivity
  connectivity_plus: ^6.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Image picker
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  freezed: ^2.5.7
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
